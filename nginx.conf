server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  gzip on;
  gzip_vary on;
  gzip_comp_level 6;
  gzip_min_length 256;
  gzip_types text/plain text/css text/xml application/javascript application/json application/xml image/svg+xml;

  location = /index.html { add_header Cache-Control "no-cache, must-revalidate"; }
  location ~* \.(png|jpg|jpeg|gif|webp|svg|ico|woff2?)$ {
    expires 30d;
    add_header Cache-Control "public, max-age=2592000, immutable";
  }
  location / { try_files $uri $uri/ /index.html; }
}
